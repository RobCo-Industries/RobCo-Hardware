# Header map of the toy board. One entry per pin of J1.
# Fields: pin number, Pi-side name, net in the schematic, software use, source.
# tools/check_pins.py reads this file. Keep to this simple YAML shape.
board: toy
connector: J1
header: generic
# The toy LED sits on GPIO 25, the default D/C pin of the SPI display. The toy
# has no display, so the pin check skips that table for GPIO 25.
ignore_sources: [SPI display:GPIO25]
pins:
  - pin: 1
    name: 5V
    net: +5V
    use: power
    source: toy test circuit
  - pin: 2
    name: GND
    net: GND
    use: ground
    source: toy test circuit
  - pin: 3
    name: GPIO25
    net: SIG
    use: toy LED
    source: toy test circuit
