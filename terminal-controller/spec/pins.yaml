# Header map of the terminal controller. One entry per pin of J1, the Pi header.
# Source: SPEC.md section 3, which tools/gen_pin_table.py writes from this file.
# Fields: pin, name (Pi pin name), function (Pi function as the spec writes it),
# net (net on this board; NC is not connected), use (the software's use, in the
# words of RobCo-Core docs/spec/BOARD_SUPPORT.md), source (where that use comes
# from), connects (what the pin reaches on this board), status.
# tools/check_pins.py reads this file. Keep to this simple YAML shape.
#
# ignore_sources skips the input example for GPIO 16, 23 and 24 only. The
# example uses them for the dial (Dial push, Dial A, Dial B). UOS has six
# buttons and no dial, so this board carries no dial: the three pins go to the
# free-pin header J7. Every other GPIO that BOARD_SUPPORT.md lists has that use
# here:
# - Input example: the six buttons reach J5 as the example maps them.
# - SPI0 on GPIO 7 to 11: not connected on this board, but the use stays the
#   software's, so a later SPI device keeps the pins. The net is NC.
# - Audio channel 1 on GPIO 18: the audio filter input.
# Not checked by check_pins.py, because its parser reads only the Pins,
# Audio and Input tables: the SPI display table in BOARD_SUPPORT.md puts the
# ILI9341 D/C on GPIO 25 and RESET on GPIO 4. This board uses GPIO 25 for ARM
# and brings GPIO 4 to J7, so a panel on the default TFT pins cannot share it.
# That display belongs to the Pip-Boy board, not to the terminal, so GPIO 25
# stays ARM. An SPI display added to this board later must not use the default
# D/C pin, GPIO 25, or the default reset pin, GPIO 4: toggling GPIO 25 would
# switch the load rail V_SW.
board: terminal-controller
connector: J1
header: pi40
ignore_sources: [Input example:GPIO16, Input example:GPIO23, Input example:GPIO24]
pins:
  - pin: 1
    name: 3V3
    function: 3V3
    net: +3V3
    use: power
    source: power
    connects: Logic 3V3 rail: U1, U2, U3, pull-ups, TP1
    status: used
  - pin: 2
    name: 5V
    function: 5V
    net: +5V
    use: power
    source: power
    connects: 5V rail: M1, JP1, TP2
    status: used
  - pin: 3
    name: GPIO2
    function: GPIO 2, SDA1
    net: I2C_SDA
    use: I2C SDA
    source: BOARD_SUPPORT.md Pins
    connects: I2C SDA to U1, U2, U3, TP4
    status: used
  - pin: 4
    name: 5V
    function: 5V
    net: +5V
    use: power
    source: power
    connects: Joined to pin 2
    status: used
  - pin: 5
    name: GPIO3
    function: GPIO 3, SCL1
    net: I2C_SCL
    use: I2C SCL
    source: BOARD_SUPPORT.md Pins
    connects: I2C SCL to U1, U2, U3, TP5
    status: used
  - pin: 6
    name: GND
    function: GND
    net: GND
    use: ground
    source: ground
    connects: GND
    status: used
  - pin: 7
    name: GPIO4
    function: GPIO 4
    net: GPIO4
    use: free
    source: UOS dev.md, free pin
    connects: J7 free-pin header
    status: free
  - pin: 8
    name: GPIO14
    function: GPIO 14, TXD
    net: UART_TX
    use: PL011 TXD
    source: BOARD_SUPPORT.md UART policy and Pins
    connects: J6 pin 5
    status: used
  - pin: 9
    name: GND
    function: GND
    net: GND
    use: ground
    source: ground
    connects: GND
    status: used
  - pin: 10
    name: GPIO15
    function: GPIO 15, RXD
    net: UART_RX
    use: PL011 RXD
    source: BOARD_SUPPORT.md UART policy and Pins
    connects: J6 pin 4
    status: used
  - pin: 11
    name: GPIO17
    function: GPIO 17
    net: BTN_LEFT
    use: LEFT
    source: BOARD_SUPPORT.md Pins, input example
    connects: J5 pin 4 (LEFT) through R42, 1 kOhm
    status: used
  - pin: 12
    name: GPIO18
    function: GPIO 18
    net: AUDIO_PWM
    use: Audio channel 1
    source: BOARD_SUPPORT.md Pins, audio table: Pi Zero at ALT5
    connects: Audio filter input
    status: used
  - pin: 13
    name: GPIO27
    function: GPIO 27
    net: BTN_BACK
    use: BACK
    source: BOARD_SUPPORT.md Pins, input example
    connects: J5 pin 7 (BACK) through R45, 1 kOhm
    status: used
  - pin: 14
    name: GND
